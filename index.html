<!DOCTYPE html>
<html>
<head>
  <title>Chaos Végétal AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.2/aframe/build/aframe-ar.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #status {
      position: fixed; left: 0; right: 0; bottom: 0;
      font-family: system-ui, sans-serif; font-size: 12px;
      background: rgba(0,0,0,.5); color: #fff; padding: 6px 10px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; facingMode: environment; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
    <a-assets timeout="30000">
      <a-asset-item id="m1" src="model1.glb"></a-asset-item>
      <a-asset-item id="m2" src="model2.glb"></a-asset-item>
    </a-assets>
    <a-marker type="pattern" url="marker.patt">
      <a-entity id="e1" gltf-model="#m1" visible="true" position="0 0 0" rotation="0 0 0"></a-entity>
      <a-entity id="e2" gltf-model="#m2" visible="false" position="0 0 0" rotation="0 0 0"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <div id="status">Prêt • Touchez l’écran pour changer de modèle</div>
  <script>
    const statusEl = document.getElementById('status');
    const e1 = document.getElementById('e1');
    const e2 = document.getElementById('e2');
    const entities = [e1, e2];
    let current = 0;
    function fitToUnit(entity, target = 1.0) {
      const THREE = window.THREE || (window.AFRAME && window.AFRAME.THREE);
      if (!THREE) return;
      const mesh = entity.getObject3D('mesh');
      if (!mesh) return;
      const box = new THREE.Box3().setFromObject(mesh);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = target / maxDim;
      entity.object3D.scale.set(scale, scale, scale);
      const center = box.getCenter(new THREE.Vector3());
      mesh.position.sub(center);
    }
    function setStatus(msg) { statusEl.textContent = msg; }
    entities.forEach((el, i) => {
      el.addEventListener('model-loaded', () => {
        fitToUnit(el, 1.0);
        setStatus(`Modèle ${i+1} chargé • Touchez l’écran pour changer`);
      });
      el.addEventListener('model-error', () => {
        setStatus(`Erreur au chargement du modèle ${i+1}`);
      });
    });
    function switchModel() {
      const next = (current + 1) % entities.length;
      if (!entities[next].getObject3D('mesh')) {
        setStatus('Chargement du modèle…');
      }
      entities[current].setAttribute('visible', 'false');
      entities[next].setAttribute('visible', 'true');
      current = next;
    }
    const isMobile = /Mobi|Android/i.test(navigator.userAgent);
    if (isMobile) {
      document.addEventListener('touchstart', switchModel, { passive: true });
    } else {
      document.addEventListener('click', switchModel);
    }
  </script>
</body>
</html>
