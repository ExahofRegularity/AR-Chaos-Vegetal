<!DOCTYPE html>
<html>
<head>
    <title>Chaos Végétal AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.2/aframe/build/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.loaders.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        .model { display: none; } /* Masquer les modèles inactifs */
    </style>
</head>
<body>
    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <a-asset-item id="model1-asset" src="model1.glb"></a-asset-item>
            <a-asset-item id="model2-asset" src="model2.glb"></a-asset-item>
        </a-assets>
        
        <a-marker type="pattern" url="marker.patt">
            <!-- Modèle 1 (visible par défaut) -->
            <a-entity id="model1" gltf-model="#model1-asset" scale="0.5 0.5 0.5" class="model active"></a-entity>
            
            <!-- Modèle 2 (caché par défaut) -->
            <a-entity id="model2" gltf-model="#model2-asset" scale="0.5 0.5 0.5" class="model"></a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const models = [
                document.getElementById('model1'),
                document.getElementById('model2')
            ];
            let currentIndex = 0;

            function switchModel() {
                // Masquer le modèle actuel
                models[currentIndex].classList.remove('active');
                
                // Passer au suivant
                currentIndex = (currentIndex + 1) % models.length;
                
                // Afficher le nouveau modèle
                models[currentIndex].classList.add('active');
                
                console.log("Modèle affiché:", currentIndex + 1); // Debug
            }

            // Écouteurs d'événements
            document.addEventListener('touchstart', switchModel, { passive: true });
            document.addEventListener('click', switchModel);
        });
    </script>
</body>
</html>
