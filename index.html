<!DOCTYPE html>
<html>
<head>
  <title>Chaos Végétal AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.2/aframe/build/aframe-ar.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; facingMode: environment; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
    <a-assets timeout="30000">
      <a-asset-item id="m1" src="model1.glb"></a-asset-item>
      <a-asset-item id="m2" src="model2.glb"></a-asset-item>
    </a-assets>
    <a-marker type="pattern" url="marker.patt">
      <a-entity id="e1" gltf-model="#m1" visible="true" position="0 0 0"></a-entity>
      <a-entity id="e2" gltf-model="#m2" visible="false" position="0 0 0"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    const e1 = document.getElementById('e1');
    const e2 = document.getElementById('e2');
    const entities = [e1, e2];
    let current = 0;
    function switchModel() {
      const next = (current + 1) % entities.length;
      entities[current].setAttribute('visible', 'false');
      entities[next].setAttribute('visible', 'true');
      current = next;
    }
    const isMobile = /Mobi|Android/i.test(navigator.userAgent);
    if (isMobile) {
      document.addEventListener('touchstart', switchModel, { passive: true });
    } else {
      document.addEventListener('click', switchModel);
    }
  </script>
</body>
</html>
