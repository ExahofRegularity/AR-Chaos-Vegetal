<!DOCTYPE html>
<html>
<head>
    <title>Chaos Végétal AR - Solution Mobile</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.2/aframe/build/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.loaders.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        [visible="false"] {
            display: none !important;
        }
    </style>
</head>
<body>
    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <a-asset-item id="model1-asset" src="model1.glb"></a-asset-item>
            <a-asset-item id="model2-asset" src="model2.glb"></a-asset-item>
        </a-assets>
        
        <a-marker type="pattern" url="marker.patt">
            <a-entity id="model1" gltf-model="#model1-asset" scale="0.5 0.5 0.5" visible="true"></a-entity>
            <a-entity id="model2" gltf-model="#model2-asset" scale="0.5 0.5 0.5" visible="false"></a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const model1 = document.getElementById('model1');
            const model2 = document.getElementById('model2');
            let currentModel = model1;
            let lastSwitchTime = 0;
            const SWITCH_COOLDOWN = 300; 

            function switchModel() {
                const now = Date.now();
                
              
                if (now - lastSwitchTime < SWITCH_COOLDOWN) {
                    return;
                }
                
                lastSwitchTime = now;
                
                currentModel.setAttribute('visible', 'false');
                
         
                currentModel = (currentModel === model1) ? model2 : model1;
                
              
                currentModel.setAttribute('visible', 'true');
                
                console.log("Modèle actif:", currentModel.id);
            }

     
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
               
                document.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    switchModel();
                }, { passive: false });
            } else {
                
                document.addEventListener('click', switchModel);
            }
        });
    </script>
</body>
</html>
