<!DOCTYPE html>
<html>
<head>
  <title>Chaos Végétal AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.2/aframe/build/aframe-ar.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;">
    <a-assets timeout="30000">
      <a-asset-item id="m1" src="model1.glb"></a-asset-item>
      <a-asset-item id="m2" src="model2.glb"></a-asset-item>
    </a-assets>
    <a-marker type="pattern" url="marker.patt">
      <a-entity id="my-model" gltf-model="#m1" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 0 0"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const modelEntity = document.getElementById('my-model');
      const models = ['#m1', '#m2'];
      let currentIndex = 0;
      let lastSwitchTime = 0;

      function switchModel() {
        const now = Date.now();
        if (now - lastSwitchTime < 300) return; // anti double déclenchement rapide
        lastSwitchTime = now;
        currentIndex = (currentIndex + 1) % models.length;
        modelEntity.setAttribute('gltf-model', models[currentIndex]);
      }

      if (/Mobi|Android/i.test(navigator.userAgent)) {
        document.addEventListener('touchstart', switchModel, { passive: true });
      } else {
        document.addEventListener('click', switchModel);
      }
    });
  </script>
</body>
</html>
